<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" role="img" aria-labelledby="title desc">
  <title id="title">Game cover placeholder</title>
  <desc id="desc">A dark purple and blue abstract game cover placeholder.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#24124d"/>
      <stop offset="1" stop-color="#0a2444"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="55%">
      <stop stop-color="#7c5cff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="800" fill="url(#background)"/>
  <rect width="600" height="800" fill="url(#glow)"/>
  <path d="M120 460 260 320l70 72 110-150 120 218v190H120Z" fill="#46d9ff" fill-opacity=".22"/>
  <circle cx="300" cy="280" r="72" fill="none" stroke="#b9acff" stroke-width="12" opacity=".8"/>
  <path d="M270 250h60v60h-60z" fill="#b9acff"/>
  <text x="300" y="650" fill="#f5f3ff" font-family="Arial, sans-serif" font-size="36" font-weight="700" text-anchor="middle">GAMEVAULT</text>
  <text x="300" y="690" fill="#c4b5fd" font-family="Arial, sans-serif" font-size="20" text-anchor="middle">GAME COVER</text>
</svg>
